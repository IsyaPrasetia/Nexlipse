<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { width: 1200px; height: 630px; background: #0d0d0f; color: #ede9e1; overflow: hidden; position: relative; }
  .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
  .orb-a { width: 460px; height: 460px; background: #d3ab67; top: -160px; right: -120px; opacity: .35; }
  .orb-b { width: 400px; height: 400px; background: #bf8a55; bottom: -140px; left: -140px; opacity: .28; }
  .card { position: absolute; inset: 60px; border: 1px solid rgba(235,232,225,.14); border-radius: 28px; padding: 46px 52px; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; gap: 20px; }
  .logo { width: 84px; height: 84px; background: linear-gradient(135deg, #d3ab67, #bf8a55); border-radius: 20px; display: grid; place-items: center; font-size: 48px; font-weight: 900; color: #0d0d0f; }
  .brand { font-size: 46px; font-weight: 800; letter-spacing: .5px; }
  .tag { font-size: 22px; font-weight: 600; color: #d3ab67; margin-top: 6px; letter-spacing: 4px; text-transform: uppercase; }
  .mid h1 { font-size: 58px; line-height: 1.15; font-weight: 800; letter-spacing: -1px; max-width: 900px; }
  .mid h1 b { background: linear-gradient(135deg, #d3ab67, #e5cb96); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .mid p { margin-top: 16px; font-size: 24px; color: #a8a299; max-width: 780px; line-height: 1.5; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 19px; color: #716b62; }
  .foot .dom { color: #a8a299; font-weight: 600; }
</style>
</head>
<body>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="card">
    <div class="top">
      <div class="logo">N</div>
      <div>
        <div class="brand">Nexlipse</div>
        <div class="tag">Mini Server Studio</div>
      </div>
    </div>
    <div class="mid">
      <h1>Solusi digital<br />dari <b>koding</b> sampai <b>server</b>.</h1>
      <p>Fullstack &amp; mini server yang dipakai beneran, setiap hari. Portfolio Mohammad Isya Prasetia.</p>
    </div>
    <div class="foot">
      <span>nexlipse.my.id</span>
      <span class="dom">⚡ 24/7 · Otomasi · Bot WhatsApp</span>
    </div>
  </div>
</body>
</html>
